name: Keep the web app awake

# Render's free tier puts the app to sleep after 15 minutes without
# requests, and waking it takes 30-60 seconds. A ping every 10 minutes keeps
# it warm. One always-on free service uses about 744 of the 750 free
# instance hours a month, so this stays within the free tier.
# GitHub may run scheduled jobs a few minutes late under load; an occasional
# cold start is still possible.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling this one on every run resets that timer.
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}

      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://acv-servicios.onrender.com/healthz
