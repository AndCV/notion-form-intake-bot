{% extends "base.html" %}
{% from "_logo.html" import mark %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;margin:28px 0 18px;text-align:center">
  {{ mark(72) }}
  <div style="font-size:22px;font-weight:700;color:var(--navy);margin-top:12px">{{ brand_name }}</div></div>
<h1>Entrar</h1>
<form method="post" action="/login" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button class="btn block" type="submit">Entrar</button>
</form>
{% endblock %}
