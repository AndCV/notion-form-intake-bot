{% from "_logo.html" import mark %}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F226F">
<title>{% block title %}Servicios{% endblock %} · {{ brand_name }}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect width='56' height='56' rx='10' fill='%23fff'/%3E%3Cpolygon points='0,0 56,0 0,56' fill='%233CCACF'/%3E%3Cpolygon points='0,0 43,0 0,43' fill='%230F226F'/%3E%3Cpolygon points='0,15 27,15 0,42' fill='%233CCACF'/%3E%3Cpolygon points='0,26 16,26 0,42' fill='%230F226F'/%3E%3Cpolygon points='56,56 39,56 56,39' fill='%233CCACF'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add("js");</script>
<style>
  :root {
    --navy: #0F226F; --teal: #3CCACF; --gray: #6A6F86; --pill: #EEF0F6;
    --bg: #F6F7FB; --card: #FFFFFF; --text: #1A1A1A; --line: #DDE0EA;
    --ok: #1B8A5A; --bad: #C0392B; --warn: #B7791F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  header { background: var(--navy); color: #fff; border-bottom: 3px solid var(--teal); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header .wrap { flex-wrap: wrap; row-gap: 10px; }
  header .brand { display: flex; align-items: center; gap: 10px; line-height: 1.15; white-space: nowrap; }
  header .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--teal); }
  header nav { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  header nav a { font-weight: 400; font-size: 15px; }
  header nav form { margin: 0; flex: none; }
  header nav button { width: auto; }
  header form { margin: 0; }
  header button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff;
                  padding: 6px 10px; border-radius: 8px; font-size: 14px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 16px; }
  h1 { font-size: 22px; color: var(--navy); margin: 8px 0 14px; }
  h2 { font-size: 17px; color: var(--navy); margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=number], input[type=date],
  input[type=datetime-local], input[type=password], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; background: #fff; }
  textarea { min-height: 70px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn { display: inline-block; background: var(--navy); color: #fff; border: 0; border-radius: 10px;
         padding: 12px 16px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn.secondary { background: var(--pill); color: var(--navy); }
  .btn.danger { background: var(--bad); }
  .btn.small { padding: 7px 12px; font-size: 14px; }
  .btn.block { display: block; width: 100%; text-align: center; margin-top: 18px; }
  .muted { color: var(--gray); font-size: 14px; }
  .errors { background: #FDECEA; border: 1px solid #F5C6C0; color: var(--bad); border-radius: 10px; padding: 10px 14px; }
  .errors ul { margin: 0; padding-left: 18px; }
  .notice { background: #FFF7E6; border: 1px solid #F3DDAF; color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .pill { display: inline-block; background: var(--pill); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--navy); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 18px; color: var(--navy); }
  .stat span { font-size: 12px; color: var(--gray); }
  .list a.item { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px;
                 border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .list a.item:last-child { border-bottom: 0; }
  .list .meta { font-size: 13px; color: var(--gray); }
  .list .amount { text-align: right; white-space: nowrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--gray); font-size: 14px; } dd { margin: 0; }
  .steps li { margin: 4px 0; } .steps { padding-left: 0; list-style: none; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .email-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .email-row input { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-top: 16px; }
  .check input { width: 20px; height: 20px; }
  .js .hidden { display: none; }
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  table.data th, table.data td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data thead th { color: var(--gray); font-weight: 600; font-size: 12px; }
  table.data tfoot td { font-weight: 700; color: var(--navy); border-bottom: 0; }
  pre.err { white-space: pre-wrap; font-size: 13px; background: #FDECEA; padding: 8px 10px; border-radius: 8px; }
  @media (max-width: 480px) {
    .stats { gap: 6px; } .stat { padding: 8px 9px; } .stat b { font-size: 15px; }
    .row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="/" class="brand">{{ mark(30) }}<span>{{ brand_name }}<small>{{ brand_tagline }}</small></span></a>
    {% if request.session.get("auth") %}
    <nav>
      <a href="/resumen">Resumen</a>
      <a href="/colaboradores">Colaboradores</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">Salir</button>
      </form>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
