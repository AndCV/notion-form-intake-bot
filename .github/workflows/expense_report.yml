name: Nightly expense report

# Closes the owner's personal spend for a day -- BN statement debits, Wink
# sends and BAC transactions (lib/payment_mail.py) -- and sends the total
# over Telegram. See scripts/nightly_expense_report.py. Logs show totals
# only -- this repo is public.
#
# No automatic schedule: run manually (Actions tab > Run workflow) to
# close yesterday, or a specific day via the `date` input.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Re-close this day (YYYY-MM-DD) instead of yesterday -- optional, for resending a corrected total"
        required: false

concurrency:
  group: expense-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The report doesn't render PDFs, but requirements.txt pulls WeasyPrint.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -r requirements.txt

      - run: python scripts/nightly_expense_report.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWN_IBAN_ACCOUNTS: ${{ secrets.OWN_IBAN_ACCOUNTS }}
          OVERRIDE_DATE: ${{ github.event.inputs.date }}
